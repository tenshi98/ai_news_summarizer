<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resumidor de titulares de NewsAPI con Qwen 2.5.">
    <title>AI News Summarizer</title>
    <!-- Hoja de estilos extraída del bloque <style> original. -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Encabezado principal de la aplicación. -->
    <h1>AI News Summarizer</h1>

    <!-- Controles de entrada del usuario. -->
    <label for="category">Elige una categoría de noticias:</label>
    <select id="category">
        <option value="technology">Tecnología</option>
        <option value="business">Negocio</option>
        <option value="sports">Deportes</option>
        <option value="entertainment">Entretenimiento</option>
        <option value="science">Ciencia</option>
        <option value="health">Salud</option>
    </select>
    <button id="fetch-button">Obtener noticias</button>

    <h2>Noticias resumidas:</h2>
    <div id="summary">Tu resumen de noticias generado por IA aparecerá aquí...</div>

    <h2>Titulares originales:</h2>
    <div id="articles"></div>

    <!-- Lógica del navegador (se carga después de parsear el HTML). -->
    <script src="/static/script.js" defer></script>

</body>
</html>
